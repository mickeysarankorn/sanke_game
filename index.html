<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Snake Game</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS to ensure the canvas scales perfectly on smaller screens */
        canvas {
            image-rendering: pixelated; /* Keeps the edges crisp */
            max-width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            touch-action: none; /* Prevents scrolling when touching canvas */
        }
        
        /* Stop text selection when spamming buttons */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center m-0 overflow-hidden font-sans select-none">

    <!-- Game Container -->
    <div class="relative flex flex-col items-center w-full max-w-md px-4">
        
        <!-- Header / Score -->
        <div class="w-full flex justify-between items-end mb-4 px-2">
            <h1 class="text-2xl font-black tracking-wider text-gray-300">SNAKE</h1>
            <div class="text-3xl font-bold tracking-widest text-green-400 drop-shadow-md bg-gray-800 px-4 py-1 rounded-lg border border-gray-700">
                <span id="score">0</span>
            </div>
        </div>

        <!-- Game Board Area -->
        <div class="relative bg-gray-800 p-2 rounded-xl shadow-[0_0_40px_rgba(34,197,94,0.15)] border border-gray-700 w-full flex items-center justify-center">
            
            <!-- Canvas: Internal resolution 400x400 -->
            <canvas id="gameCanvas" width="400" height="400" class="block rounded bg-[#0f172a] shadow-inner"></canvas>
            
            <!-- Game Over Overlay (Hidden by default) -->
            <div id="gameOver" class="absolute inset-0 bg-black/85 hidden flex-col items-center justify-center rounded-xl z-10 backdrop-blur-sm transition-opacity">
                <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">GAME OVER</h2>
                <p class="text-gray-300 mb-6 text-lg">Final Score: <span id="finalScore" class="font-bold text-white">0</span></p>
                <button id="restartBtn" class="px-8 py-3 bg-green-500 hover:bg-green-400 text-gray-900 text-lg font-extrabold rounded-full transition-transform transform hover:scale-105 active:scale-95 shadow-[0_0_15px_rgba(34,197,94,0.5)]">
                    PLAY AGAIN
                </button>
            </div>
        </div>
        
        <!-- On-Screen Controls for Mobile/Touch -->
        <div class="mt-8 grid grid-cols-3 gap-2 w-48 md:hidden no-select">
            <div></div> <!-- Empty top-left cell -->
            <button class="control-btn bg-gray-800/80 p-4 rounded-xl active:bg-gray-700 flex items-center justify-center text-2xl border border-gray-700 active:border-gray-500 shadow-lg" id="btn-up">⬆️</button>
            <div></div> <!-- Empty top-right cell -->
            
            <button class="control-btn bg-gray-800/80 p-4 rounded-xl active:bg-gray-700 flex items-center justify-center text-2xl border border-gray-700 active:border-gray-500 shadow-lg" id="btn-left">⬅️</button>
            <button class="control-btn bg-gray-800/80 p-4 rounded-xl active:bg-gray-700 flex items-center justify-center text-2xl border border-gray-700 active:border-gray-500 shadow-lg" id="btn-down">⬇️</button>
            <button class="control-btn bg-gray-800/80 p-4 rounded-xl active:bg-gray-700 flex items-center justify-center text-2xl border border-gray-700 active:border-gray-500 shadow-lg" id="btn-right">➡️</button>
        </div>
        
        <p class="text-gray-500 text-sm mt-6 hidden md:block">Use <kbd class="bg-gray-800 px-1 py-0.5 rounded border border-gray-700 text-gray-300">Arrow Keys</kbd> or <kbd class="bg-gray-800 px-1 py-0.5 rounded border border-gray-700 text-gray-300">W A S D</kbd> to move</p>
    </div>

    <script>
        /**
         * Snake Game Logic
         */
        
        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');

        // Game Configuration
        const gridSize = 20; // Size of each tile in pixels
        const tileCount = canvas.width / gridSize; // 400 / 20 = 20 tiles across and down

        // State Variables
        let snake = [];
        let dx = 0; // Current velocity X
        let dy = 0; // Current velocity Y
        let nextDx = 0; // Buffered velocity X (prevents reversing into self quickly)
        let nextDy = 0; // Buffered velocity Y
        let food = { x: 0, y: 0 };
        let score = 0;
        let isGameOver = false;
        
        // Loop Variables
        let lastRenderTime = 0;
        let snakeSpeed = 8; // Tiles per second

        // Initialize Game
        function init() {
            // Start snake in the middle
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            
            // Reset variables
            dx = 0;
            dy = -1; // Start moving up
            nextDx = 0;
            nextDy = -1;
            score = 0;
            snakeSpeed = 8;
            isGameOver = false;
            
            scoreEl.innerText = score;
            
            // Hide Game Over screen
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            
            placeFood();
            window.requestAnimationFrame(gameLoop);
        }

        // Main Game Loop using requestAnimationFrame for smooth rendering
        function gameLoop(currentTime) {
            if (isGameOver) return;
            
            window.requestAnimationFrame(gameLoop);
            
            // Calculate time since last render to control snake speed
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < 1 / snakeSpeed) return;
            
            lastRenderTime = currentTime;
            
            update();
            draw();
        }

        // Update Game State (Logic)
        function update() {
            // Apply buffered inputs securely (prevents 180 degree turns)
            if (nextDx !== 0 && dx !== -nextDx) { dx = nextDx; dy = 0; }
            else if (nextDy !== 0 && dy !== -nextDy) { dy = nextDy; dx = 0; }
            else { dx = nextDx; dy = nextDy; }

            // Calculate new head position
            const head = { 
                x: snake[0].x + dx, 
                y: snake[0].y + dy 
            };

            // 1. Check Wall Collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return handleGameOver();
            }

            // 2. Check Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return handleGameOver();
                }
            }

            // Move snake forward
            snake.unshift(head);

            // 3. Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                // Increase speed slightly as score increases (max cap at 20)
                snakeSpeed = Math.min(20, snakeSpeed + 0.2); 
                placeFood();
            } else {
                // Remove tail if no food eaten
                snake.pop(); 
            }
        }

        // Draw Game State (Rendering)
        function draw() {
            // Clear entire canvas with dark background
            ctx.fillStyle = '#0f172a'; // match bg-[#0f172a]
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw faint grid (Aesthetics)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for(let i = 0; i <= canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); // Verticals
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); // Horizontals
            }

            // Draw Food (Apple) with glow
            ctx.fillStyle = '#ef4444'; // Red
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            // Draw a circle for food
            ctx.arc(
                food.x * gridSize + (gridSize/2), 
                food.y * gridSize + (gridSize/2), 
                (gridSize/2) - 2, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Snake
            snake.forEach((segment, index) => {
                // Head is lighter green, body is standard green
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#4ade80' : '#22c55e';
                
                if (isHead) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#4ade80';
                } else {
                    ctx.shadowBlur = 0;
                }

                // Leave 1px gap for segments to see individual blocks
                ctx.fillRect(
                    segment.x * gridSize + 1, 
                    segment.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2
                );
            });
            ctx.shadowBlur = 0; // Reset
        }

        // Randomly place food ensuring it doesn't spawn on the snake
        function placeFood() {
            let validPlacement = false;
            while (!validPlacement) {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                // Check if food coordinates overlap with any snake segment
                validPlacement = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // Trigger Game Over Sequence
        function handleGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
        }

        // Input Handling function
        function setDirection(x, y) {
            // Prevent backwards movement directly into itself
            // e.g., if moving right (dx === 1), you cannot command left (x === -1)
            if (x !== 0 && dx === -x) return;
            if (y !== 0 && dy === -y) return;
            
            // Set the buffered direction
            nextDx = x;
            nextDy = y;
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    setDirection(1, 0);
                    break;
            }
        });

        // Mobile / Mouse On-Screen Controls
        const btnMap = [
            { id: 'btn-up', x: 0, y: -1 },
            { id: 'btn-down', x: 0, y: 1 },
            { id: 'btn-left', x: -1, y: 0 },
            { id: 'btn-right', x: 1, y: 0 },
        ];

        btnMap.forEach(btn => {
            const el = document.getElementById(btn.id);
            // Handle touch
            el.addEventListener('touchstart', (e) => { 
                e.preventDefault(); // Stop default zooming/scrolling
                setDirection(btn.x, btn.y); 
            });
            // Handle mouse clicks for testing desktop
            el.addEventListener('mousedown', () => setDirection(btn.x, btn.y));
        });

        // Restart Button Click
        restartBtn.addEventListener('click', init);

        // Start the game on page load
        window.onload = init;

    </script>
</body>
</html>
